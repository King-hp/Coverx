    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="index.html" class="logo">
        Cover<span>X</span>
    </a>


    <nav class="desktop-nav">

        <a href="index.html">
            Home
        </a>

        <a href="index.html#categories">
            Categories
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>


    <button
        class="cart-btn"
        onclick="openCart()"
    >

        🛒 Cart

        <span id="cartCount">
            0
        </span>

    </button>

</header>



<!-- ================= CATEGORY HERO ================= -->

<section class="category-hero">

    <div class="category-hero-content">

        <p class="small-title">
            COVERX COLLECTION
        </p>


        <h1 id="categoryTitle">
            Mobile Covers
        </h1>


        <p id="categoryDescription">
            Find the perfect accessory for your smartphone.
        </p>

    </div>

</section>



<!-- ================= PRODUCTS ================= -->

<section class="products-section">


    <div class="section-title">

        <p>
            SHOP NOW
        </p>

        <h2 id="productHeading">
            Mobile Covers
        </h2>

    </div>



    <!-- SEARCH -->

    <div class="category-controls">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search model or product..."
            oninput="filterProducts()"
        >


        <select
            id="brandFilter"
            onchange="filterProducts()"
        >

            <option value="All">
                All Brands
            </option>

        </select>


        <select
            id="modelFilter"
            onchange="filterProducts()"
        >

            <option value="All">
                All Models
            </option>

        </select>

    </div>



    <!-- PRODUCT GRID -->

    <div
        class="product-grid"
        id="categoryProductGrid"
    >

    </div>



    <!-- NO PRODUCT -->

    <div
        id="noProduct"
        style="display:none;text-align:center;padding:50px;"
    >

        <h2>
            😔 Product Not Found
        </h2>

        <p>
            Try another model or brand.
        </p>

    </div>


</section>



<!-- ================= CART ================= -->

<div
    class="cart-overlay"
    id="cartOverlay"
    onclick="closeCart(event)"
>


    <div
        class="cart-box"
        onclick="event.stopPropagation()"
    >


        <div class="cart-header">

            <h2>
                🛒 Your Cart
            </h2>


            <button onclick="closeCart()">
                ✕
            </button>

        </div>



        <div id="cartItems">

        </div>



        <div class="cart-total">

            <span>
                Total
            </span>


            <strong id="cartTotal">
                ₹0
            </strong>

        </div>



        <button
            class="checkout-btn"
            onclick="checkoutWhatsApp()"
        >

            📲 Checkout on WhatsApp

        </button>


    </div>

</div>



<!-- ================= JAVASCRIPT ================= -->

<script>


// ==================================================
// PRODUCT DATABASE
// ==================================================

const products = [

    {

    // ================= GLASS =================

    },


    {

    {

    },


    // ================= CAMERA LENS =================

    {
        id: 7,
        name: "Camera Lens Protector",
        category: "Lens",
        brand: "Vivo",
        model: "Vivo V40",
        price: 129,
        image: "images/lens/vivo-v40.jpg"
    },


    {
        id: 8,
        name: "Camera Lens Glass",
        category: "Lens",
        brand: "Apple",
        model: "iPhone 15",
        price: 149,
        image: "images/lens/iphone15.jpg"
    },


    {
        id: 9,
        name: "Camera Protection Lens",
        category: "Lens",
        brand: "Samsung",
        model: "Samsung A15",
        price: 129,
        image: "images/lens/samsung-a15.jpg"
    },


    // ================= CHARGERS =================

    {
        id: 10,
        name: "33W Fast Charger",
        category: "Charger",
        brand: "Realme",
        model: "Universal",
        price: 499,
        image: "images/chargers/realme.jpg"
    },


    {
        id: 11,
        name: "25W Fast Charger",
        category: "Charger",
        brand: "Samsung",
        model: "Universal",
        price: 599,
        image: "images/chargers/samsung.jpg"
    },


    {
        id: 12,
        name: "67W Super Fast Charger",
        category: "Charger",
        brand: "Vivo",
        model: "Universal",
        price: 699,
        image: "images/chargers/vivo.jpg"
    },


    // ================= CABLES =================

    {
        id: 13,
        name: "Type-C Fast Charging Cable",
        category: "Cable",
        brand: "Oppo",
        model: "Type-C",
        price: 199,
        image: "images/cables/oppo.jpg"
    },


    {
        id: 14,
        name: "Type-C Data Cable",
        category: "Cable",
        brand: "Realme",
        model: "Type-C",
        price: 199,
        image: "images/cables/realme.jpg"
    },


    {
        id: 15,
        name: "Lightning Cable",
        category: "Cable",
        brand: "Apple",
        model: "Lightning",
        price: 299,
        image: "images/cables/apple.jpg"
    }

];



// ==================================================
// GET CATEGORY FROM URL
// ==================================================

const urlParams =
    new URLSearchParams(window.location.search);


const currentCategory =
    urlParams.get("category") || "Cover";



// ==================================================
// CATEGORY INFORMATION
// ==================================================

const categoryInfo = {


    Cover: {

        title: "Mobile Covers",

        description:
            "Stylish and protective covers for your smartphone."

    },


    Glass: {

        title: "Tempered Glass",

        description:
            "Protect your phone screen from scratches and damage."

    },


    Lens: {

        title: "Camera Lens",

        description:
            "Protect your smartphone camera with quality lens protection."

    },


    Charger: {

        title: "Chargers",

        description:
            "Fast and reliable chargers for your smartphone."

    },


    Cable: {

        title: "Cables",

        description:
            "Durable charging and data cables."

    }

};



// ==================================================
// SET CATEGORY TITLE
// ==================================================

function setCategoryInfo() {


    const info =
        categoryInfo[currentCategory];


    if (!info) return;


    document.getElementById(
        "categoryTitle"
    ).innerText = info.title;


    document.getElementById(
        "productHeading"
    ).innerText = info.title;


    document.getElementById(
        "categoryDescription"
    ).innerText = info.description;

}



// ==================================================
// LOAD FILTERS
// ==================================================

function loadFilters() {


    const categoryProducts =
        products.filter(
            product =>
                product.category === currentCategory
        );


    const brands = [

        ...new Set(
            categoryProducts.map(
                product => product.brand
            )
        )

    ];


    const models = [

        ...new Set(
            categoryProducts.map(
                product => product.model
            )
        )

    ];



    const brandFilter =
        document.getElementById(
            "brandFilter"
        );


    const modelFilter =
        document.getElementById(
            "modelFilter"
        );



    brands.forEach(brand => {

        const option =
            document.createElement("option");


        option.value = brand;

        option.innerText = brand;


        brandFilter.appendChild(option);

    });



    models.forEach(model => {

        const option =
            document.createElement("option");


        option.value = model;

        option.innerText = model;


        modelFilter.appendChild(option);

    });

}



// ==================================================
// DISPLAY PRODUCTS
// ==================================================

function displayProducts(productList) {


    const grid =
        document.getElementById(
            "categoryProductGrid"
        );


    const noProduct =
        document.getElementById(
            "noProduct"
        );


    grid.innerHTML = "";



    if (productList.length === 0) {

        noProduct.style.display =
            "block";

        return;

    }


    noProduct.style.display =
        "none";



    productList.forEach(product => {


        const card =
            document.createElement("div");


        card.className =
            "product-card";



        card.innerHTML = `


            <div class="product-image">

    <img
        src="${product.image}"
        alt="${product.name}"
        style="
            width: ${product.imageWidth || '150px'};
            height: ${product.imageHeight || '180px'};
            object-fit: contain;
        "
        onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
        "
    >


                <div
                    class="image-fallback"
                    style="
                        display:none;
                        width:100%;
                        height:100%;
                        align-items:center;
                        justify-content:center;
                        font-size:60px;
                    "
                >
                    📱
                </div>


            </div>



            <div class="product-info">


                <p class="product-category">

                    ${product.brand}

                </p>



                <h3>

                    ${product.name}

                </h3>



                <p>

                    ${product.model}

                </p>



                <div class="product-bottom">


                    <strong>

                        ₹${product.price}

                    </strong>



                    <button
                        onclick="
                            addToCart(
                                '${product.name}',
                                ${product.price},
                                '${product.category}'
                            )
                        "
                    >

                        Add to Cart

                    </button>


                </div>


            </div>

        `;


        grid.appendChild(card);

    });

}



// ==================================================
// FILTER PRODUCTS
// ==================================================

function filterProducts() {


    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const selectedBrand =
        document
        .getElementById("brandFilter")
        .value;


    const selectedModel =
        document
        .getElementById("modelFilter")
        .value;



    let filtered =
        products.filter(product => {


            const categoryMatch =
                product.category ===
                currentCategory;


            const searchMatch =

                product.name
                .toLowerCase()
                .includes(search)

                ||

                product.model
                .toLowerCase()
                .includes(search)

                ||

                product.brand
                .toLowerCase()
                .includes(search);



            const brandMatch =

                selectedBrand === "All"

                ||

                product.brand ===
                selectedBrand;



            const modelMatch =

                selectedModel === "All"

                ||

                product.model ===
                selectedModel;



            return (
                categoryMatch &&
                searchMatch &&
                brandMatch &&
                modelMatch
            );

        });



    displayProducts(filtered);

}



// ==================================================
// CART
// ==================================================

let cart =
    JSON.parse(
        localStorage.getItem("coverXCart")
    ) || [];



function saveCart() {

    localStorage.setItem(
        "coverXCart",
        JSON.stringify(cart)
    );

}



// ==================================================
// ADD TO CART
// ==================================================

function addToCart(
    name,
    price,
    category
) {


    const existing =
        cart.find(
            item =>
                item.name === name
        );


    if (existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            name: name,

            price: price,

            category: category,

            quantity: 1

        });

    }


    saveCart();

    updateCart();

}



// ==================================================
// UPDATE CART
// ==================================================

function updateCart() {


    const cartCount =
        document.getElementById(
            "cartCount"
        );


    const cartItems =
        document.getElementById(
            "cartItems"
        );


    const cartTotal =
        document.getElementById(
            "cartTotal"
        );


    let totalItems = 0;

    let totalPrice = 0;


    cartItems.innerHTML = "";



    cart.forEach((item, index) => {


        totalItems +=
            item.quantity;


        totalPrice +=
            item.price *
            item.quantity;



        const div =
            document.createElement("div");


        div.className =
            "cart-item";


        div.innerHTML = `

            <div>

                <strong>
                    ${item.name}
                </strong>

                <p>
                    ₹${item.price}
                </p>

            </div>


            <div>

                <button
                    onclick="changeQuantity(${index}, -1)"
                >
                    −
                </button>


                <span>
                    ${item.quantity}
                </span>


                <button
                    onclick="changeQuantity(${index}, 1)"
                >
                    +
                </button>


                <button
                    onclick="removeFromCart(${index})"
                >
                    🗑️
                </button>

            </div>

        `;


        cartItems.appendChild(div);

    });



    cartCount.innerText =
        totalItems;


    cartTotal.innerText =
        "₹" + totalPrice;

}



// ==================================================
// CHANGE QUANTITY
// ==================================================

function changeQuantity(
    index,
    change
) {


    cart[index].quantity +=
        change;


    if (
        cart[index].quantity <= 0
    ) {

        cart.splice(index, 1);

    }


    saveCart();

    updateCart();

}



// ==================================================
// REMOVE
// ==================================================

function removeFromCart(index) {


    cart.splice(index, 1);


    saveCart();

    updateCart();

}



// ==================================================
// OPEN CART
// ==================================================

function openCart() {

    document
        .getElementById("cartOverlay")
        .classList.add("active");

}



// ==================================================
// CLOSE CART
// ==================================================

function closeCart(event) {


    if (
        event &&
        event.target.id !==
        "cartOverlay"
    ) return;


    document
        .getElementById("cartOverlay")
        .classList.remove("active");

}



// ==================================================
// WHATSAPP CHECKOUT
// ==================================================

function checkoutWhatsApp() {


    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }



    const whatsappNumber =
        "918087143887";


    let message =
        "🛍️ *CoverX Order*%0A%0A";


    let total = 0;



    cart.forEach(
        (item, index) => {


            const itemTotal =
                item.price *
                item.quantity;


            total += itemTotal;


            message +=

                `${index + 1}. ${item.name}%0A` +

                `Category: ${item.category}%0A` +

                `Qty: ${item.quantity}%0A` +

                `Price: ₹${itemTotal}%0A%0A`;

        }
    );



    message +=
        `*Total: ₹${total}*%0A%0A`;


    message +=
        "Please confirm my order.";



    window.open(

        `https://wa.me/${whatsappNumber}?text=${message}`,

        "_blank"

    );

}



// ==================================================
// START
// ==================================================

setCategoryInfo();

loadFilters();

displayProducts(
    products.filter(
        product =>
            product.category ===
            currentCategory
    )
);

updateCart();

</script>


</body>

</html>
